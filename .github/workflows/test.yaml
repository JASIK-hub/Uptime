name: Go Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:  
          POSTGRES_USER: uptime_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: uptime_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U uptime_test -d uptime_test"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=10
    env:
      POSTGRES_TEST_HOST: 127.0.0.1
      POSTGRES_TEST_PORT: "5433"
      POSTGRES_TEST_USER: uptime_test
      POSTGRES_TEST_PASSWORD: test_only
      POSTGRES_TEST_DB: uptime_test
            

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Apply test migrations
        run: make test-integration
        
      - name: Run Race Detector
        run: go test -race ./...

      
