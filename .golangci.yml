version: "2"

run:
  timeout: 5m
  tests: true
  issues-exit-code: 1

linters:
  settings:
    govet: 
      enable:
        - shadow
    gosec:
      severity: "medium"
      confidence: "medium"
    goconst:
      min-len: 3
      min-occurrences: 3
  default:none
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - bodyclose
    - noctx
    - unused
    - goconst
    - ineffasign


issues:
  uniq-by-line: true